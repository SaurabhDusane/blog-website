name: Public document smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Summary
        if: always()
        run: |
          if [ -f .data/document-import-report.txt ]; then
            printf "## Document conversion\n\n```text\n" >> "$GITHUB_STEP_SUMMARY"
            cat .data/document-import-report.txt >> "$GITHUB_STEP_SUMMARY"
            printf "```\n" >> "$GITHUB_STEP_SUMMARY"
          fi
